name: Publish API to Azure ACR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish API image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ca7e04894508acr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: |
            ca7e04894508acr.azurecr.io/album-api:latest
            ca7e04894508acr.azurecr.io/album-api:${{ github.sha }}
  deploy:
    name: Deploy API to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Login to Azure using deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy API image
        run: |
          az containerapp update \
            --name album-api \
            --resource-group rg-azure-container-apps-dev \
            --image ca7e04894508acr.azurecr.io/album-api:${{ github.sha }}

      - name: Verify deployment
        run: |
          az containerapp show \
            --name album-api \
            --resource-group rg-azure-container-apps-dev \
            --query "{image:properties.template.containers[0].image,latestRevision:properties.latestRevisionName}" \
            --output table
